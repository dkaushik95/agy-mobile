<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1c1e" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a84ff" />
      <stop offset="100%" stop-color="#5e5ce6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Continuous Squircle Background -->
  <rect width="512" height="512" rx="115" fill="url(#bg)" />
  <rect width="512" height="512" rx="115" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4" />
  <!-- Glowing Orb / Core -->
  <circle cx="256" cy="256" r="140" fill="url(#accent)" opacity="0.15" filter="url(#glow)" />
  <!-- Antigravity Chevron / Spark Icon -->
  <g transform="translate(256, 256) scale(1.6)" filter="url(#glow)">
    <path d="M-40,30 L0,-40 L40,30 L20,30 L0,-10 L-20,30 Z" fill="url(#accent)" />
    <circle cx="0" cy="42" r="8" fill="#30d158" />
  </g>
</svg>
